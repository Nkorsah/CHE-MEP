<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOLIMIT CHE MEP</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--mute:#6b6a66;--line:#dcdad3;--free:#e7f4ea;--freeb:#9fcfaa;--taken:#f3e3e3;--takenb:#d9a3a3;--mine:#e4ecfb;--mineb:#8fb0ea;--accent:#3b5bdb}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#161615;--card:#212120;--text:#eeede8;--mute:#9a9992;--line:#38382f;--free:#1d3322;--freeb:#3d6b49;--taken:#3a2323;--takenb:#7a4444;--mine:#1f2b45;--mineb:#4a6bb5;--accent:#7b97f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:.02em}
p.sub{margin:0 0 16px;color:var(--mute)}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:.9rem;color:var(--mute)}
.pill{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.admin{color:var(--accent);border-color:var(--accent)}
section{margin:24px 0}
section h2{margin:0;font-size:1.2rem}
section .meta{margin:2px 0 10px;color:var(--mute);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.slot{border:2px solid var(--freeb);background:var(--free);border-radius:12px;padding:10px;min-height:84px;cursor:pointer;text-align:left;color:var(--text);font:inherit;display:flex;flex-direction:column;gap:4px}
.slot.taken{border-color:var(--takenb);background:var(--taken)}
.slot.mine{border-color:var(--mineb);background:var(--mine)}
.slot .n{font-weight:700;font-size:1.1rem}
.slot .who{font-size:.9rem;overflow-wrap:anywhere}
.slot .st{font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.slot:disabled{cursor:default;opacity:.75}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:20px;width:min(360px,90vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;font-size:1.15rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=datetime-local]{width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
label.chk{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:.9rem;color:var(--mute)}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
button.b{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer}
button.b.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.b.del{color:#c0392b}
button.link{background:none;border:0;color:var(--mute);font:inherit;font-size:.85rem;cursor:pointer;text-decoration:underline;padding:0}
#msg{color:var(--mute);margin:10px 0;font-size:.9rem}
footer{margin-top:30px;text-align:center}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button.sm{padding:4px 10px;font-size:.8rem;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit}
button.sm.del{color:#c0392b}
#addSong{margin:6px 0 0}
iframe.yt{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
#vmsg{color:#c0392b;font-size:.85rem;margin:-8px 0 12px}
video{display:block;width:100%;max-height:70vh;border-radius:12px;background:#000;margin:8px 0 16px}
/* status colors: open (grey) / filled (yellow) / finished (green) */
:root{--open:#fff;--openb:#cfcdc5;--fill:#fdf1c0;--fillb:#e0bf3f;--done:#e1f3e5;--doneb:#7fc08e}
@media (prefers-color-scheme:dark){:root{--open:#212120;--openb:#4a4a42;--fill:#3b3414;--fillb:#9a7f1f;--done:#1d3322;--doneb:#3d6b49}}
.slot{border-color:var(--openb);background:var(--open)}
.slot.taken{border-color:var(--fillb);background:var(--fill)}
.slot.mine{border-color:var(--fillb);background:var(--fill);box-shadow:0 0 0 3px var(--mineb)}
.slot.done{border-color:var(--doneb);background:var(--done)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mute);margin:0 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid;vertical-align:-2px;margin-right:5px}
.cd{text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0 12px}
#cdlabel{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
#cdtime{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
#cdwhen{font-size:.8rem;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>NOLIMIT CHE MEP</h1>
  <div class="cd" id="cd" hidden><div id="cdlabel"></div><div id="cdtime"></div><div id="cdwhen"></div></div>
  <div id="vwrap"></div>
  <div id="vmsg"></div>
  <p class="sub">Tap a green slot to claim it. You can only hold one slot, and you can remove yours anytime to pick a different one.</p>
  <div class="bar"><span class="pill" id="count">Loading…</span><span class="pill admin" id="adm" hidden>Owner mode: tap any slot to place, edit or clear someone</span><button class="sm" id="vbtn" hidden>Change video</button><button class="sm" id="dbtn" hidden>Set deadline</button></div>
  <div class="legend"><span><i style="background:var(--open);border-color:var(--openb)"></i>Open</span><span><i style="background:var(--fill);border-color:var(--fillb)"></i>Filled</span><span><i style="background:var(--done);border-color:var(--doneb)"></i>Finished</span></div>
  <div id="msg"></div>
  <div id="sections"></div>
  <button class="b pri" id="addSong" hidden>+ Add new song</button>
  <footer><button class="link" id="adminLink">Owner login</button></footer>
</main>

<dialog id="dlg">
  <h2 id="dt"></h2>
  <input type="text" id="name" maxlength="40" placeholder="Name or username" autocomplete="off">
  <label class="chk" id="meWrap" hidden><input type="checkbox" id="me"> This is my own slot</label>
  <div class="row" id="btns"></div>
</dialog>

<dialog id="sdlg">
  <h2 id="sdt"></h2>
  <input type="text" id="sname" maxlength="40" placeholder="Song name" autocomplete="off">
  <input type="number" id="scount" min="1" max="100" placeholder="Number of slots">
  <div id="serr" style="color:#c0392b;font-size:.85rem"></div>
  <div class="row">
    <button class="b" id="scancel">Cancel</button>
    <button class="b pri" id="sok">Save</button>
  </div>
</dialog>

<dialog id="vdlg">
  <h2>Change video</h2>
  <input type="file" id="vfile" accept="video/*" style="margin-bottom:8px;width:100%">
  <input type="text" id="vurl" placeholder="…or paste a video / YouTube link" autocomplete="off">
  <div id="vstat" style="font-size:.85rem;color:var(--mute)"></div>
  <div class="row">
    <button class="b" id="vcancel">Cancel</button>
    <button class="b pri" id="vok">Save video</button>
  </div>
</dialog>

<dialog id="ddlg">
  <h2>Set deadline</h2>
  <input type="text" id="dlabel" maxlength="40" placeholder="Label (e.g. Parts due)" autocomplete="off">
  <input type="datetime-local" id="dtime">
  <div id="derr" style="color:#c0392b;font-size:.85rem"></div>
  <div class="row">
    <button class="b" id="dcancel">Cancel</button>
    <button class="b del" id="dremove">Remove</button>
    <button class="b pri" id="dok">Save</button>
  </div>
</dialog>

<dialog id="login">
  <h2>Owner login</h2>
  <input type="email" id="em" placeholder="Email" autocomplete="username">
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <div id="lerr" style="color:#c0392b;font-size:.85rem"></div>
  <div class="row">
    <button class="b" id="lcancel">Cancel</button>
    <button class="b pri" id="lgo">Log in</button>
  </div>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, writeBatch, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

// 1) PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps > Web app)
const firebaseConfig = {
  apiKey: "AIzaSyDXnEQN6uxqQwQjHdu5lCtbcYZeZ8Yuw1E",
  authDomain: "che-mep-firebase.firebaseapp.com",
  projectId: "che-mep-firebase",
  storageBucket: "che-mep-firebase.firebasestorage.app",
  messagingSenderId: "876526821768",
  appId: "1:876526821768:web:a86534726cf914ea85da3d",
  measurementId: "G-0REHXBYMPC"
};

// Default songs, used until the owner changes them (after that they're stored in Firestore)
const range = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);
const DEFAULT_SONGS = [
  {name:'DIOR LEOPARD', slots:range(1,18)},
  {name:'UAV', slots:range(19,32)},
  {name:'MATCHES', slots:range(33,39)},
  {name:'HELLRAISER', slots:range(40,45)}
];
let songs = DEFAULT_SONGS, cfgReady = false;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const $ = id => document.getElementById(id);
const data = {};
let me = null, isAdmin = false, ready = false;

function mySlot() {
  if (!me) return null;
  for (const k in data) if (data[k].uid === me.uid) return +k;
  return null;
}

function say(t) { $('msg').textContent = t || ''; }

function ownerUI() {
  $('adm').hidden = !isAdmin;
  $('addSong').hidden = !isAdmin;
  $('vbtn').hidden = !isAdmin;
  $('dbtn').hidden = !isAdmin;
  $('adminLink').textContent = isAdmin ? 'Log out of owner mode' : 'Owner login';
}

function render() {
  ownerUI();
  const root = $('sections'); root.innerHTML = '';
  if (!cfgReady) { $('count').textContent = 'Loading…'; return; }
  const mine = mySlot();
  let taken = 0, total = 0, finished = 0;
  songs.forEach((song, idx) => {
    const sec = document.createElement('section');
    const head = document.createElement('div'); head.className = 'shead';
    const h = document.createElement('h2'); h.textContent = song.name;
    head.appendChild(h);
    if (isAdmin) {
      const t = document.createElement('div'); t.className = 'tools';
      const mk = (label, cls, fn) => { const x = document.createElement('button'); x.className = 'sm ' + (cls || ''); x.textContent = label; x.onclick = fn; t.appendChild(x); };
      mk('+ Add slots', '', () => addSlots(idx));
      mk('− Last slot', '', () => removeLastSlot(idx));
      mk('Rename', '', () => renameSong(idx));
      mk('Delete song', 'del', () => removeSong(idx));
      head.appendChild(t);
    }
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = song.slots.length + ' slots';
    const g = document.createElement('div'); g.className = 'grid';
    song.slots.forEach(i => {
      total++;
      const d = data[i], isMine = !!(d && me && d.uid === me.uid);
      const b = document.createElement('button');
      b.className = 'slot' + (d ? ' taken' : '') + (d && d.done ? ' done' : '') + (isMine ? ' mine' : '');
      const n = document.createElement('span'); n.className = 'n'; n.textContent = '#' + i;
      const w = document.createElement('span'); w.className = 'who'; w.textContent = d ? d.name : 'Open';
      const st = document.createElement('span'); st.className = 'st'; st.textContent = d ? (d.done ? 'Finished' : (isMine ? 'Yours' : 'Filled')) : 'Available';
      b.append(n, w, st);
      if (d) taken++;
      if (d && d.done) finished++;
      const canAct = ready && me && (isAdmin || isMine || (!d && mine === null));
      if (canAct) b.onclick = () => openSlot(i); else b.disabled = true;
      g.appendChild(b);
    });
    sec.append(head, m, g);
    root.appendChild(sec);
  });
  $('count').textContent = taken + ' / ' + total + ' filled · ' + finished + ' finished';
  if (mine !== null && !isAdmin) say('You have slot #' + mine + '. Remove it first if you want a different one.');
}

// ---- Owner tools: songs and slots ----
const clone = () => songs.map(s => ({name: s.name, slots: [...s.slots]}));
const nextNum = () => Math.max(0, ...songs.flatMap(s => s.slots)) + 1;
const saveSongs = list => setDoc(doc(db, 'config', 'songs'), {songs: list});
let sAction = null;

function openSong({title, name = null, count = null, ok}) {
  $('sdt').textContent = title;
  $('sname').hidden = name === null; $('sname').value = name || '';
  $('scount').hidden = count === null; $('scount').value = count || '';
  $('serr').textContent = '';
  sAction = ok;
  $('sdlg').showModal();
}
$('scancel').onclick = () => $('sdlg').close();
$('sok').onclick = async () => {
  const nm = $('sname').value.trim(), ct = parseInt($('scount').value, 10);
  if (!$('sname').hidden && !nm) { $('serr').textContent = 'Enter a name.'; return; }
  if (!$('scount').hidden && !(ct >= 1 && ct <= 100)) { $('serr').textContent = 'Enter a number from 1 to 100.'; return; }
  try { await sAction(nm, ct); $('sdlg').close(); }
  catch (e) { console.error(e); $('serr').textContent = 'Couldn’t save. Check your Firebase rules and try again.'; }
};

$('addSong').onclick = () => openSong({title: 'Add new song', name: '', count: 10, ok: (nm, ct) => {
  const l = clone(); let n = nextNum();
  l.push({name: nm, slots: Array.from({length: ct}, () => n++)});
  return saveSongs(l);
}});

function addSlots(idx) {
  openSong({title: 'Add slots to ' + songs[idx].name, count: 1, ok: (_, ct) => {
    const l = clone(); let n = nextNum();
    for (let k = 0; k < ct; k++) l[idx].slots.push(n++);
    return saveSongs(l);
  }});
}

function renameSong(idx) {
  openSong({title: 'Rename song', name: songs[idx].name, ok: nm => { const l = clone(); l[idx].name = nm; return saveSongs(l); }});
}

// Delete claims (and the claimers' "holder" records) for a list of slot numbers inside a batch
function dropClaims(batch, nums) {
  nums.forEach(n => {
    const d = data[n];
    if (d) { batch.delete(doc(db, 'slots', String(n))); if (d.uid) batch.delete(doc(db, 'holders', d.uid)); }
  });
}

async function removeLastSlot(idx) {
  const l = clone(), last = l[idx].slots[l[idx].slots.length - 1];
  if (last === undefined) return;
  if (data[last] && !confirm('Slot #' + last + ' is taken by ' + data[last].name + '. Remove it anyway?')) return;
  try {
    l[idx].slots.pop();
    const batch = writeBatch(db);
    dropClaims(batch, [last]);
    batch.set(doc(db, 'config', 'songs'), {songs: l});
    await batch.commit();
  } catch (e) { console.error(e); say('Couldn’t remove that slot.'); }
}

async function removeSong(idx) {
  const song = songs[idx], claimed = song.slots.filter(n => data[n]).length;
  if (!confirm('Delete "' + song.name + '" and its ' + song.slots.length + ' slots' + (claimed ? ' (' + claimed + ' taken)' : '') + '?')) return;
  try {
    const l = clone(); l.splice(idx, 1);
    const batch = writeBatch(db);
    dropClaims(batch, song.slots);
    batch.set(doc(db, 'config', 'songs'), {songs: l});
    await batch.commit();
  } catch (e) { console.error(e); say('Couldn’t delete that song.'); }
}

// ---- Video: default file in the repo, or whatever the owner set ----
const DEFAULT_VIDEOS = ['Che%20Mep%20Parts.mp4', 'Che_Mep_Parts.mp4'];
let curVideo = null;
function showVideo(url, alts = []) {
  if (url === curVideo) return;
  curVideo = url;
  const w = $('vwrap'); w.innerHTML = ''; $('vmsg').textContent = '';
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  let el;
  if (yt) {
    el = document.createElement('iframe'); el.className = 'yt';
    el.src = 'https://www.youtube.com/embed/' + yt[1];
    el.allowFullscreen = true;
    el.allow = 'accelerometer; encrypted-media; picture-in-picture; fullscreen';
  } else {
    el = document.createElement('video');
    el.controls = true; el.playsInline = true; el.preload = 'metadata'; el.src = url;
    el.onerror = () => {
      if (alts.length) { el.src = alts.shift(); return; }
      $('vmsg').textContent = 'Couldn’t load the video file (' + url + '). ' +
        (isAdmin ? 'Use “Change video” to upload it or paste a link.' : 'The owner needs to fix the video.');
    };
  }
  w.appendChild(el);
}
const showDefaultVideo = () => showVideo(DEFAULT_VIDEOS[0], DEFAULT_VIDEOS.slice(1));
showDefaultVideo();

$('vbtn').onclick = () => { $('vfile').value = ''; $('vurl').value = ''; $('vstat').textContent = ''; $('vdlg').showModal(); };
$('vcancel').onclick = () => $('vdlg').close();
$('vok').onclick = async () => {
  const f = $('vfile').files[0], link = $('vurl').value.trim();
  const stat = $('vstat');
  try {
    let url = link;
    if (f) {
      if (!f.type.startsWith('video/')) { stat.textContent = 'Please choose a video file.'; return; }
      $('vok').disabled = true;
      const r = ref(storage, 'video/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g, '_'));
      const task = uploadBytesResumable(r, f, {contentType: f.type});
      await new Promise((res, rej) => {
        task.on('state_changed',
          sn => { stat.textContent = 'Uploading… ' + Math.round(100 * sn.bytesTransferred / sn.totalBytes) + '%'; },
          rej, res);
      });
      url = await getDownloadURL(r);
    }
    if (!url) { stat.textContent = 'Choose a file or paste a link.'; return; }
    await setDoc(doc(db, 'config', 'video'), {url});
    $('vdlg').close();
  } catch (e) {
    console.error(e);
    stat.textContent = 'Couldn’t save the video (' + (e.code || e.message) + '). Storage may not be set up, or its rules aren’t published. Pasting a YouTube link works without Storage.';
  } finally { $('vok').disabled = false; }
};

onSnapshot(doc(db, 'config', 'video'), snap => {
  if (snap.exists() && snap.data().url) showVideo(snap.data().url); else showDefaultVideo();
}, e => console.error(e));

// ---- Countdown: the owner sets a deadline, everyone sees it live ----
let deadline = null;
const pad2 = n => String(n).padStart(2, '0');
function tick() {
  const box = $('cd');
  if (!deadline) { box.hidden = true; return; }
  box.hidden = false;
  $('cdlabel').textContent = deadline.label || 'Deadline';
  $('cdwhen').textContent = new Date(deadline.ts).toLocaleString([], {dateStyle: 'full', timeStyle: 'short'});
  const ms = deadline.ts - Date.now();
  if (ms <= 0) { $('cdtime').textContent = 'Time’s up!'; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, sec = Math.floor(ms / 1e3) % 60;
  $('cdtime').textContent = d + 'd ' + pad2(h) + 'h ' + pad2(m) + 'm ' + pad2(sec) + 's';
}
setInterval(tick, 1000);
onSnapshot(doc(db, 'config', 'deadline'), snap => {
  deadline = snap.exists() && snap.data().ts ? snap.data() : null;
  tick();
}, e => console.error(e));

const toLocalInput = t => { const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
$('dbtn').onclick = () => {
  $('dlabel').value = deadline ? (deadline.label || '') : '';
  $('dtime').value = deadline ? toLocalInput(deadline.ts) : '';
  $('derr').textContent = '';
  $('ddlg').showModal();
};
$('dcancel').onclick = () => $('ddlg').close();
$('dremove').onclick = async () => {
  try { await setDoc(doc(db, 'config', 'deadline'), {ts: null, label: ''}); $('ddlg').close(); }
  catch (e) { console.error(e); $('derr').textContent = 'Couldn’t remove it. Check your Firebase rules.'; }
};
$('dok').onclick = async () => {
  const v = $('dtime').value;
  if (!v) { $('derr').textContent = 'Pick a date and time.'; return; }
  try {
    await setDoc(doc(db, 'config', 'deadline'), {ts: new Date(v).getTime(), label: $('dlabel').value.trim()});
    $('ddlg').close();
  } catch (e) { console.error(e); $('derr').textContent = 'Couldn’t save. Check your Firebase rules.'; }
};

function btn(label, cls, fn) {
  const b = document.createElement('button'); b.className = 'b ' + (cls || ''); b.textContent = label; b.onclick = fn; $('btns').appendChild(b);
}

function openSlot(i) {
  const d = data[i], isMine = !!(d && d.uid === me.uid);
  $('dt').textContent = d ? (isAdmin && !isMine ? 'Edit slot #' + i : 'Your slot #' + i) : 'Claim slot #' + i;
  $('name').value = d ? d.name : '';
  $('meWrap').hidden = !(isAdmin && !d);
  $('me').checked = false;
  $('btns').innerHTML = '';
  btn('Cancel', '', () => $('dlg').close());
  if (d && isAdmin) btn(d.done ? 'Mark unfinished' : 'Mark finished', '', () => setDone(i, !d.done));
  if (d && (isAdmin || !d.done)) btn(isMine && !isAdmin ? 'Remove me' : 'Clear', 'del', () => clearSlot(i));
  btn(d ? 'Save' : 'Claim', 'pri', () => saveSlot(i));
  $('dlg').showModal();
  setTimeout(() => $('name').focus(), 50);
}

async function saveSlot(i) {
  const name = $('name').value.trim();
  if (!name) return;
  const prev = data[i];
  try {
    if (prev) {
      // rename (keeps the same owner)
      await updateDoc(doc(db, 'slots', String(i)), { name });
    } else if (isAdmin && !$('me').checked) {
      // owner placing someone else
      await setDoc(doc(db, 'slots', String(i)), { name, uid: null });
    } else {
      if (mySlot() !== null) { $('dlg').close(); say('You already hold slot #' + mySlot() + '. Remove it first.'); return; }
      const batch = writeBatch(db);
      batch.set(doc(db, 'slots', String(i)), { name, uid: me.uid });
      batch.set(doc(db, 'holders', me.uid), { slot: String(i) });
      await batch.commit();
    }
    $('dlg').close();
  } catch (e) { fail(e); }
}

async function setDone(i, val) {
  try {
    await updateDoc(doc(db, 'slots', String(i)), { done: val });
    $('dlg').close();
  } catch (e) { console.error(e); $('dlg').close(); say('Couldn’t update that part. Check your Firebase rules.'); }
}

async function clearSlot(i) {
  const d = data[i];
  try {
    const batch = writeBatch(db);
    batch.delete(doc(db, 'slots', String(i)));
    if (d && d.uid) batch.delete(doc(db, 'holders', d.uid));
    await batch.commit();
    $('dlg').close();
  } catch (e) { fail(e); }
}

function fail(e) {
  console.error(e);
  $('dlg').close();
  say('Couldn’t save that change. Someone may have just taken that slot — try again.');
}

$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('btns').lastChild.click(); });

// Owner login
$('adminLink').onclick = async () => {
  if (isAdmin) { await signOut(auth); return; } // onAuthStateChanged signs back in anonymously
  $('lerr').textContent = ''; $('login').showModal();
};
$('lcancel').onclick = () => $('login').close();
$('lgo').onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value);
    $('pw').value = ''; $('login').close();
  } catch (e) { $('lerr').textContent = 'Wrong email or password.'; }
};

// Auth: everyone gets an anonymous account automatically (remembered by the browser)
onAuthStateChanged(auth, async u => {
  if (!u) { try { await signInAnonymously(auth); } catch (e) { say('Couldn’t connect. Check the Firebase setup.'); } return; }
  me = u; isAdmin = !u.isAnonymous; ready = true; render();
});

onSnapshot(collection(db, 'slots'), snap => {
  for (const k in data) delete data[k];
  snap.forEach(d => { data[d.id] = d.data(); });
  render();
}, e => { console.error(e); say('Couldn’t load slots. Check your Firebase config and rules.'); });

onSnapshot(doc(db, 'config', 'songs'), snap => {
  songs = snap.exists() ? snap.data().songs : DEFAULT_SONGS;
  cfgReady = true; render();
}, e => { console.error(e); songs = DEFAULT_SONGS; cfgReady = true; render(); });

render();
</script>
</body>
</html>
